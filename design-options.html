<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather design options</title>
<style>
:root{--bg:#f4efe6;--surface:#fffcf7;--box:#EFE7DA;--box-line:#E2D8C8;--ink:#201c17;--ink-2:#6b6256;--ink-3:#9a9085;--line:rgba(32,28,23,.09);--accent:#d97757;--accent-soft:rgba(217,119,87,.14);--good:#4f9d69;--bad:#d1495b;--shadow:0 1px 1px rgba(40,28,16,.04),0 6px 18px -6px rgba(40,28,16,.16);--r-lg:18px;--r-md:13px;--r-sm:9px;--cloud:#cfc6b8;--cloud-d:#a79e92;--sun:#f0a93b;--moon:#e8d49a;--drop:#5b9bd5;--page:#e7e0d3}
:root[data-theme=dark]{--bg:#1b1814;--surface:#2a2621;--box:#322d27;--box-line:transparent;--ink:#f3ede3;--ink-2:#b5aa9b;--ink-3:#847a6e;--line:rgba(255,245,230,.08);--accent-soft:rgba(217,119,87,.2);--shadow:0 1px 1px rgba(0,0,0,.25),0 8px 20px -8px rgba(0,0,0,.6);--cloud:#6d655b;--cloud-d:#8b8277;--page:#12100d}
*{box-sizing:border-box;margin:0}body{font:13px/1.35 -apple-system,system-ui,sans-serif;background:var(--page);color:var(--ink);padding:28px 20px 60px}
h1{font:650 22px ui-rounded,system-ui;text-align:center}p.sub{text-align:center;color:var(--ink-2);margin:6px 0 22px}
.bar{display:flex;gap:8px;justify-content:center;margin-bottom:26px}.bar button{border:0;border-radius:10px;padding:8px 16px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font:600 12.5px system-ui;cursor:pointer}.bar button.on{background:var(--accent);color:#fff8f2}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.opt{width:380px}.opt h2{font:650 15px ui-rounded,system-ui;text-align:center;margin-bottom:3px}.opt .cap{text-align:center;color:var(--ink-2);font-size:12px;margin-bottom:12px;min-height:32px}
.panel{background:var(--bg);border-radius:22px;padding:16px 14px;box-shadow:0 2px 2px rgba(0,0,0,.05),0 22px 44px -14px rgba(0,0,0,.35);height:610px;overflow:hidden}
.num{font-family:ui-rounded,"SF Pro Rounded",system-ui;font-weight:600;letter-spacing:-.03em}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.tile svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr{text-align:center;font:650 13px ui-rounded,system-ui;margin-bottom:10px;color:var(--ink-2)}
.ftr{text-align:center;color:var(--ink-3);font-size:11px;margin-top:9px}
.wx .wx-sun circle,.wx .wx-rays rect{fill:var(--sun)}.wx .wx-moon{fill:var(--moon)}.wx .wx-cloud{fill:var(--cloud)}.wx .wx-cloud-dark{fill:var(--cloud-d)}.wx .wx-back{fill:var(--cloud)}.wx .wx-drop{stroke:var(--drop);stroke-width:2.4;stroke-linecap:round}.wx .wx-bolt{fill:var(--sun)}.wx .wx-flake{fill:var(--ink-3)}.wx .wx-fog rect{fill:var(--cloud-d)}
.wx .wx-rays{animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.wx .wx-drop{animation:fall 1.1s linear infinite}@keyframes fall{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(5px);opacity:0}}
.wx .wx-cloud{animation:drift 7s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(1.6px)}}
.bartrack{height:5px;border-radius:3px;background:var(--box);position:relative;flex:1}.bartrack i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#6fb3d9,#f0a93b)}
.small{color:var(--ink-3);font-size:11px}
.apple{background:transparent;padding:6px 4px}
</style></head><body>
<h1>Weather: design options</h1><p class="sub">Ludus design language. Same data, three layouts. Pick with the council.</p>
<div class="bar"><button class="on" data-t="light">Light</button><button data-t="dark">Dark</button></div>
<div class="row" id="row"></div>
<script src="web/icons.js"></script>
<script>
const I={feel:'<svg viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>',wind:'<svg viewBox="0 0 24 24"><path d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5M3 12h15a2.5 2.5 0 1 1-2.5 2.5M3 16h7"/></svg>',uv:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',rain:'<svg viewBox="0 0 24 24"><path d="M12 3s6 6.2 6 10.2A6 6 0 0 1 6 13.2C6 9.2 12 3 12 3z"/></svg>',sun:'<svg viewBox="0 0 24 24"><path d="M12 4v-1M12 21v-1M4 12H3M21 12h-1"/><circle cx="12" cy="12" r="4"/></svg>',air:'<svg viewBox="0 0 24 24"><path d="M4 9c3-3 6 3 9 0s5-1 7 0M4 15c3-3 6 3 9 0s5-1 7 0"/></svg>',pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.2A7 7 0 0 0 5 9.8C5 14.8 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></svg>',gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>'};
const hours=[['Now','partly',11],['12','cloud',11],['13','drizzle',12],['14','cloud',12],['15','cloud',13],['16','cloud',13],['17','partly',12],['18','clear-n',10]];
const days=[['Today','drizzle',8,15,35],['Tue','cloud',9,13,10],['Wed','rain',8,12,70],['Thu','partly',7,14,5],['Fri','clear',6,16,0],['Sat','clear',7,17,0],['Sun','cloud',9,15,20]];
const places=[['Alvarenga','clear',17],['Dijon','cloud',10],['Fontainebleau','cloud',11],['Folgarida','cloud',9]];
const bar=(lo,hi)=>{const a=(lo-4)/16*100,b=(hi-4)/16*100;return `<div class="bartrack"><i style="left:${a}%;right:${100-b}%"></i></div>`};
function hero(big){return `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:4px 4px 0"><div><div style="font:650 15px ui-rounded,system-ui">Paris</div><div class="num" style="font-size:${big?64:54}px;line-height:1;margin-top:2px">10°</div></div><div style="text-align:right">${wxIcon('drizzle',big?58:46)}<div style="font-weight:600;margin-top:2px">Drizzle</div><div class="small">H 15°  L 8°</div></div></div>`}
function strip(){return `<div style="display:flex;gap:2px;overflow:hidden">${hours.map(h=>`<div style="flex:1;text-align:center;padding:6px 0"><div class="small">${h[0]}</div><div style="margin:4px 0">${wxIcon(h[1],26)}</div><div style="font-weight:600">${h[2]}°</div></div>`).join('')}</div>`}
function dayRows(n){return days.slice(0,n).map(d=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0"><div style="width:44px;font-weight:600">${d[0]}</div>${wxIcon(d[1],24)}<div class="small" style="width:30px;color:var(--drop)">${d[4]?d[4]+'%':''}</div><div style="width:24px;text-align:right;color:var(--ink-2)">${d[2]}°</div>${bar(d[2],d[3])}<div style="width:24px;font-weight:600">${d[3]}°</div></div>`).join('')}
function placeRows(){return places.map(p=>`<div style="display:flex;align-items:center;padding:7px 4px"><div style="flex:1;font-weight:500">${p[0]}</div>${wxIcon(p[1],22)}<div style="width:40px;text-align:right;font-weight:600">${p[2]}°</div></div>`).join('')}
function tile(ic,t,v,s){return `<div class="card" style="padding:11px 12px;display:flex;gap:10px;align-items:center"><div class="tile">${I[ic]}</div><div style="min-width:0"><div class="small">${t}</div><div style="font:650 15px ui-rounded,system-ui">${v}</div>${s?`<div class="small">${s}</div>`:''}</div></div>`}
const foot=`<div class="ftr">Updated 2 min ago · Open-Meteo</div>`;
const A=`<div class="hdr">Weather</div><div class="card" style="padding:12px 14px">${hero()}</div>
<div class="card" style="margin-top:9px;padding:6px 10px">${strip()}</div>
<div class="card" style="margin-top:9px;padding:6px 14px">${dayRows(5)}</div>
<div class="card" style="margin-top:9px;padding:4px 10px">${placeRows()}</div>${foot}`;
const B=`<div class="hdr">Paris</div><div class="card" style="padding:14px 16px;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)">${hero(1)}<div style="display:flex;gap:8px;margin-top:10px;align-items:center" class="small"><span class="tile" style="width:22px;height:22px">${I.feel}</span>Feels like 7°<span style="margin-left:auto">Rain 35%</span></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px">${tile('wind','Wind','14 km/h','From the west')}${tile('uv','UV index','2','Low')}${tile('rain','Rain chance','35%','Next hour 20%')}${tile('sun','Sunrise','07:52','Sunset 18:44')}</div>
<div class="card" style="margin-top:9px;padding:6px 10px">${strip()}</div>
<div class="card" style="margin-top:9px;padding:6px 14px">${dayRows(4)}</div>${foot}`;
const C=`<div class="hdr">Weather</div><div style="display:flex;gap:4px;background:var(--box);padding:3px;border-radius:11px;margin-bottom:10px">${['Now','Hours','10 days','Places'].map((t,i)=>`<div style="flex:1;text-align:center;padding:6px 0;border-radius:9px;font-weight:600;font-size:12px;${i==0?'background:var(--surface);box-shadow:var(--shadow)':'color:var(--ink-2)'}">${t}</div>`).join('')}</div>
<div class="card" style="padding:18px 16px;text-align:center"><div style="font:650 14px ui-rounded,system-ui;color:var(--ink-2)">Paris</div><div style="display:flex;justify-content:center;margin:6px 0">${wxIcon('drizzle',84)}</div><div class="num" style="font-size:72px;line-height:1">10°</div><div style="font-weight:600;margin-top:4px">Drizzle</div><div class="small">H 15°  L 8°  ·  Feels like 7°</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:9px">${['wind|Wind|14','rain|Rain|35%','uv|UV|2'].map(x=>{const [i,t,v]=x.split('|');return `<div class="card" style="padding:10px;text-align:center"><div class="tile" style="margin:0 auto 5px">${I[i]}</div><div class="small">${t}</div><div style="font:650 15px ui-rounded,system-ui">${v}</div></div>`}).join('')}</div>
<div class="card" style="margin-top:9px;padding:6px 10px">${strip()}</div>${foot}`;
const opts=[['A  Classic stack','Closest to the Apple reference: hero, hours, days, places in four soft cards.',A],['B  Detail cards','Hero with a warm glow, then icon-tile cards for wind, UV, rain and sun, plus hours and days.',B],['C  Tabs','One calm screen at a time: Now, Hours, 10 days, Places. Fewer things on screen.',C]];
document.getElementById('row').innerHTML=opts.map(o=>`<div class="opt"><h2>${o[0]}</h2><div class="cap">${o[1]}</div><div class="panel">${o[2]}</div></div>`).join('');
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.t;document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x==b))});
</script></body></html>
